<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhichMap - Compare Travel Times</title>
</head>
<body>
    <header>
        <h1>WhichMap</h1>
        <p>Compare travel times across Google Maps, Apple Maps, and Waze</p>
    </header>

    <main>
        <section aria-labelledby="form-heading">
            <h2 id="form-heading" class="visually-hidden">Route Comparison Form</h2>
            <form id="compareForm" novalidate>
                <div>
                    <label for="startLocation">Starting Location</label>
                    <input
                        type="text"
                        id="startLocation"
                        name="startLocation"
                        placeholder="Enter starting address"
                        required
                        aria-required="true"
                    >
                </div>

                <div>
                    <label for="endLocation">Destination</label>
                    <input
                        type="text"
                        id="endLocation"
                        name="endLocation"
                        placeholder="Enter destination address"
                        required
                        aria-required="true"
                    >
                </div>

                <button type="submit">Compare Routes</button>
            </form>

            <div id="errorMessage" role="alert" aria-live="polite" hidden></div>
        </section>

        <section id="resultsSection" aria-labelledby="results-heading" hidden>
            <h2 id="results-heading">Results</h2>

            <div id="loadingState" aria-live="polite" aria-busy="true" hidden>
                <p>Loading route comparisons...</p>
            </div>

            <div id="resultsContainer" role="list">
                <!-- Results will be inserted here -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
